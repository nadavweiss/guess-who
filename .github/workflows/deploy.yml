name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject names from the NAMES secret
        env:
          NAMES: ${{ secrets.NAMES }}
        run: |
          mkdir -p _site
          python3 - <<'EOF'
          import json, os
          names = [n.strip() for n in os.environ.get("NAMES", "").splitlines() if n.strip()]
          html = open("index.html", encoding="utf-8").read()
          marker = "/*__NAMES__*/[]"
          assert marker in html, "names placeholder missing from index.html"
          html = html.replace(marker, json.dumps(names, ensure_ascii=False))
          open("_site/index.html", "w", encoding="utf-8").write(html)
          print(f"Injected {len(names)} names")
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
